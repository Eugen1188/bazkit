name: Monitor Bazkit

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check application and database health
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          PUBLIC_URL: ${{ vars.BAZKIT_PUBLIC_URL }}
        run: |
          test -n "$SERVER_HOST"
          if [ -z "$PUBLIC_URL" ]; then
            PUBLIC_URL="http://${SERVER_HOST}:8080"
          fi
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 5 \
            --max-time 15 \
            "${PUBLIC_URL%/}/health/"
