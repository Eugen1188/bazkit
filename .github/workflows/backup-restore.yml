name: Verify Bazkit backup restore

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

jobs:
  restore-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Restore latest backup in an isolated database
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/bazkit
            docker compose run --rm --entrypoint /usr/local/bin/verify-backup-restore backup
