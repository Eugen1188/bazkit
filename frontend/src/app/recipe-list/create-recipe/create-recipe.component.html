<main class="recipe-editor">
  <header><h1>Rezept erstellen</h1><p>Produkt, Menge und Einheit werden getrennt gespeichert.</p></header>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <section class="card grid">
    <label class="wide">Rezeptname<input [(ngModel)]="recipeName" name="recipeName" maxlength="100" required></label>
    <label class="wide">Beschreibung<textarea [(ngModel)]="description" name="description" rows="3"></textarea></label>
    <label>Portionen<input type="number" [(ngModel)]="servings" name="servings" min="1"></label>
    <label>Zeit (Min.)<input type="number" [(ngModel)]="preparationTime" name="preparationTime" min="0"></label>
    <label>Kategorie<select [(ngModel)]="category" name="category"><option *ngFor="let item of categories" [value]="item.value">{{ item.label }}</option></select></label>
  </section>

  <section class="card">
    <h2>Zutaten</h2>
    <div class="ingredient" *ngFor="let ingredient of ingredients; let i = index">
      <div class="product-field">
        <label [for]="'ingredient-' + i">Produkt</label>
        <input [id]="'ingredient-' + i" [ngModel]="ingredient.name" (ngModelChange)="onIngredientNameChange(i, $event)"
               (focus)="openIngredientSuggestions(i)" (blur)="closeIngredientSuggestions()" autocomplete="off" maxlength="100">
        <small *ngIf="ingredient.product !== null" class="selected">✓ Produkt ausgewählt</small>
        <div class="suggestions" *ngIf="activeIngredientIndex === i && isIngredientSuggestionsOpen">
          <div class="status" *ngIf="isIngredientSearching">Suche …</div>
          <button type="button" *ngFor="let product of ingredientSuggestions" (mousedown)="$event.preventDefault()"
                  (click)="selectIngredientSuggestion(i, product)" [disabled]="selectingIngredientIndex !== null">
            <span>{{ product.name }}<small *ngIf="product.brand"> · {{ product.brand }}</small></span>
            <em>{{ product.origin === 'bls' ? 'BLS' : product.origin === 'open_food_facts' ? 'Open Food Facts' : 'Datenbank' }}</em>
          </button>
          <div class="status" *ngIf="!isIngredientSearching && !ingredientSuggestions.length">Keine passenden Produkte gefunden.</div>
        </div>
      </div>
      <label>Menge<input type="number" [(ngModel)]="ingredient.quantity" [name]="'quantity-' + i" min="0" step="0.01"></label>
      <label>Einheit<select [(ngModel)]="ingredient.unit" [name]="'unit-' + i"><option *ngFor="let unit of units" [value]="unit">{{ unit }}</option></select></label>
      <div class="row-actions">
        <button type="button" (click)="moveIngredientUp(i)" [disabled]="i === 0" aria-label="Nach oben">↑</button>
        <button type="button" (click)="moveIngredientDown(i)" [disabled]="i === ingredients.length - 1" aria-label="Nach unten">↓</button>
        <button type="button" class="danger" (click)="removeIngredient(i)">Entfernen</button>
      </div>
    </div>
    <button type="button" (click)="addIngredient()" [disabled]="!canAddIngredient()">+ Zutat</button>
  </section>

  <section class="card">
    <h2>Zubereitung</h2>
    <div class="step" *ngFor="let step of preparationSteps; let i = index">
      <span>{{ i + 1 }}.</span><textarea [(ngModel)]="step.text" [name]="'step-' + i" rows="2"></textarea>
      <div class="row-actions"><button type="button" (click)="moveStepUp(i)" [disabled]="i === 0">↑</button><button type="button" (click)="moveStepDown(i)" [disabled]="i === preparationSteps.length - 1">↓</button><button type="button" class="danger" (click)="removePreparationStep(i)">Entfernen</button></div>
    </div>
    <button type="button" (click)="addPreparationStep()" [disabled]="!canAddPreparationStep()">+ Schritt</button>
  </section>

  <section class="card grid">
    <h2 class="wide">Optionale Angaben pro Portion</h2>
    <label>Kalorien<input type="number" [(ngModel)]="calories" name="calories" min="0" step="0.01"></label>
    <label>Protein (g)<input type="number" [(ngModel)]="protein" name="protein" min="0" step="0.01"></label>
    <label>Kohlenhydrate (g)<input type="number" [(ngModel)]="carbohydrates" name="carbohydrates" min="0" step="0.01"></label>
    <label>Fett (g)<input type="number" [(ngModel)]="fat" name="fat" min="0" step="0.01"></label>
    <label>Ballaststoffe (g)<input type="number" [(ngModel)]="fiber" name="fiber" min="0" step="0.01"></label>
    <label>Gesamtpreis (€)<input type="number" [(ngModel)]="estimatedPrice" name="estimatedPrice" min="0" step="0.01"></label>
    <label class="wide">Notizen<textarea [(ngModel)]="notes" name="notes" rows="3"></textarea></label>
  </section>

  <footer><button type="button" class="secondary" (click)="cancel()" [disabled]="isSaving">Abbrechen</button><button type="button" class="primary" (click)="saveRecipe()" [disabled]="isSaving || selectingIngredientIndex !== null">{{ isSaving ? 'Speichert …' : 'Rezept speichern' }}</button></footer>
</main>
