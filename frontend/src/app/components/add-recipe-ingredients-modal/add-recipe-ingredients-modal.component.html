<div
  class="modal-backdrop"
  (click)="closeModal()"
>

  <div
    class="modal"
    (click)="$event.stopPropagation()"
  >

    <div class="modal-header">

      <div>

        <h2>
          Zutaten aus Rezept übernehmen
        </h2>

        <p>
          Wähle ein Rezept aus.
          Alle Zutaten werden zu deiner
          Einkaufsliste hinzugefügt.
        </p>

      </div>


      <button
        class="close-button"
        type="button"
        aria-label="Schließen"
        (click)="closeModal()"
      >
        ×
      </button>

    </div>


    <!-- LOADING -->

    <div
      class="loading-state"
      *ngIf="isLoading"
    >

      <div class="loader"></div>

      <span>
        Rezepte werden geladen...
      </span>

    </div>


    <!-- ERROR -->

    <div
      class="error-state"
      *ngIf="
        !isLoading &&
        errorMessage
      "
    >
      {{ errorMessage }}
    </div>


    <!-- EMPTY -->

    <div
      class="empty-state"
      *ngIf="
        !isLoading &&
        !errorMessage &&
        recipes.length === 0
      "
    >

      <div class="empty-icon">
        🍽️
      </div>

      <strong>
        Noch keine Rezepte
      </strong>

      <p>
        Erstelle zuerst ein Rezept,
        um dessen Zutaten übernehmen
        zu können.
      </p>

    </div>


    <!-- RECIPES -->

    <div
      class="recipe-options"
      *ngIf="
        !isLoading &&
        recipes.length > 0
      "
    >

      <button
        class="recipe-option"
        type="button"
        *ngFor="let recipe of recipes"
        [disabled]="isAdding"
        (click)="addRecipe(recipe)"
      >

        <div class="recipe-icon">
          🍽️
        </div>


        <div class="recipe-info">

          <strong>
            {{ recipe.name }}
          </strong>

          <div class="recipe-meta">

            <span>
              {{ recipe.servings }}
              {{
                recipe.servings === 1
                  ? 'Portion'
                  : 'Portionen'
              }}
            </span>

            <span>
              ·
            </span>

            <span>
              {{ recipe.ingredients.length }}
              {{
                recipe.ingredients.length === 1
                  ? 'Zutat'
                  : 'Zutaten'
              }}
            </span>

          </div>

        </div>


        <div class="recipe-action">

          <span
            class="small-loader"
            *ngIf="
              isAdding &&
              selectedRecipeId === recipe.id
            "
          >
          </span>

          <span
            class="arrow"
            *ngIf="
              !isAdding ||
              selectedRecipeId !== recipe.id
            "
          >
            ›
          </span>

        </div>

      </button>

    </div>


    <button
      class="cancel-button"
      type="button"
      [disabled]="isAdding"
      (click)="closeModal()"
    >
      Abbrechen
    </button>

  </div>

</div>
