<div
  class="modal-backdrop"
  (click)="closeModal()"
>
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="add-product-modal-title"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <div class="modal-heading">
        <h2 id="add-product-modal-title">
          Produkt hinzufügen
        </h2>

        <p>
          Füge ein einzelnes Produkt
          zu deiner Einkaufsliste hinzu.
        </p>
      </div>

      <button
        class="close-button"
        type="button"
        aria-label="Schließen"
        [disabled]="isSaving"
        (click)="closeModal()"
      >
        ×
      </button>
    </div>

    <div class="modal-content">
      <div
        class="error-message"
        *ngIf="errorMessage"
        role="alert"
      >
        {{ errorMessage }}
      </div>

      <div class="field product-field">
        <label for="productName">
          Produktname
        </label>

        <input
          id="productName"
          type="text"
          maxlength="100"
          autocomplete="off"
          [(ngModel)]="productName"
          placeholder="z. B. Milch, Tomaten, Brot..."
          (keyup.enter)="saveProduct()"
        />

        <small class="product-help">
          Gib den Namen so ein, wie er auf deiner Einkaufsliste
          erscheinen soll.
        </small>
      </div>

      <div class="two-columns">
        <div class="field">
          <label for="quantity">
            Menge
          </label>

          <input
            id="quantity"
            type="number"
            inputmode="decimal"
            min="0.01"
            step="0.01"
            [(ngModel)]="quantity"
            (keyup.enter)="saveProduct()"
          />
        </div>

        <div class="field">
          <label for="unit">
            Einheit
          </label>

          <select
            id="unit"
            [(ngModel)]="unit"
          >
            <option
              *ngFor="let currentUnit of units"
              [value]="currentUnit"
            >
              {{ currentUnit }}
            </option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="note">
          Notiz

          <span>
            (optional)
          </span>
        </label>

        <input
          id="note"
          type="text"
          maxlength="255"
          [(ngModel)]="note"
          placeholder="z. B. Bio, reif, fettarm..."
          (keyup.enter)="saveProduct()"
        />
      </div>
    </div>

    <div class="modal-actions">
      <button
        class="secondary-button"
        type="button"
        [disabled]="isSaving"
        (click)="closeModal()"
      >
        Abbrechen
      </button>

      <button
        class="primary-button"
        type="button"
        [disabled]="
          isSaving ||
          !productName.trim() ||
          quantity === null ||
          quantity <= 0
        "
        (click)="saveProduct()"
      >
        {{
          isSaving
            ? 'Wird hinzugefügt...'
            : 'Produkt hinzufügen'
        }}
      </button>
    </div>
  </div>
</div>
