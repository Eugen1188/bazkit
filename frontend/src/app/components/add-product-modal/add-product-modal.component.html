<div
  class="modal-backdrop"
  (click)="closeModal()"
>
  <div
    class="modal"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <div class="modal-heading">
        <h2>
          Produkt hinzufügen
        </h2>

        <p>
          Füge ein einzelnes Produkt
          zu deiner Einkaufsliste hinzu.
        </p>
      </div>

      <button
        class="close-button"
        type="button"
        aria-label="Schließen"
        [disabled]="isSaving"
        (click)="closeModal()"
      >
        ×
      </button>
    </div>

    <div class="modal-content">
      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>

      <div class="field product-field">
        <label for="productName">
          Produktname
        </label>

        <div class="suggestion-wrapper">
          <input
            id="productName"
            type="text"
            maxlength="100"
            autocomplete="off"
            [ngModel]="productName"
            (ngModelChange)="onProductNameChange($event)"
            placeholder="z. B. Milch, Tomaten, Brot..."
            (focus)="openSuggestions()"
            (blur)="closeSuggestions()"
            (keyup.enter)="saveProduct()"
          />

          <div
            class="suggestions"
            *ngIf="isSuggestionsOpen"
          >
            <div
              class="suggestion-loading"
              *ngIf="isSearching"
            >
              Produkte werden gesucht...
            </div>

            <button
              class="suggestion-item"
              type="button"
              *ngFor="let product of suggestions"
              (mousedown)="selectProduct(product)"
            >
              <span class="suggestion-name">
                {{ product.name }}
              </span>

              <span
                class="suggestion-unit"
              >
                {{
                  product.origin === 'bls'
                    ? 'BLS'
                    : product.origin === 'open_food_facts'
                      ? 'Open Food Facts'
                      : 'Bazkit'
                }}
                <ng-container *ngIf="product.default_unit">
                  · {{ product.default_unit }}
                </ng-container>
              </span>
            </button>

            <div
              class="suggestion-empty"
              *ngIf="
                !isSearching &&
                suggestions.length === 0
              "
            >
              Keine passenden Produkte gefunden.
            </div>
          </div>
        </div>

        <small class="product-help">
          Kein passender Treffer? Eigene Produktnamen sind erlaubt und
          werden nur in dieser Einkaufsliste gespeichert.
        </small>
      </div>

      <div class="two-columns">
        <div class="field">
          <label for="quantity">
            Menge
          </label>

          <input
            id="quantity"
            type="number"
            inputmode="decimal"
            min="0.01"
            step="0.01"
            [(ngModel)]="quantity"
            (keyup.enter)="saveProduct()"
          />
        </div>

        <div class="field">
          <label for="unit">
            Einheit
          </label>

          <select
            id="unit"
            [(ngModel)]="unit"
          >
            <option
              *ngFor="let currentUnit of units"
              [value]="currentUnit"
            >
              {{ currentUnit }}
            </option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="note">
          Notiz

          <span>
            (optional)
          </span>
        </label>

        <input
          id="note"
          type="text"
          maxlength="255"
          [(ngModel)]="note"
          placeholder="z. B. Bio, reif, fettarm..."
          (keyup.enter)="saveProduct()"
        />
      </div>
    </div>

    <div class="modal-actions">
      <button
        class="secondary-button"
        type="button"
        [disabled]="isSaving"
        (click)="closeModal()"
      >
        Abbrechen
      </button>

      <button
        class="primary-button"
        type="button"
        [disabled]="
          isSaving ||
          !productName.trim() ||
          quantity === null ||
          quantity <= 0
        "
        (click)="saveProduct()"
      >
        {{
          isSaving
            ? 'Wird hinzugefügt...'
            : 'Produkt hinzufügen'
        }}
      </button>
    </div>
  </div>
</div>
