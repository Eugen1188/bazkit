<div
  class="modal-backdrop"
  (click)="closeModal()"
>

  <div
    class="modal"
    (click)="$event.stopPropagation()"
  >

    <div class="modal-header">

      <div>

        <h2>
          Produkt hinzufügen
        </h2>

        <p>
          Füge ein einzelnes Produkt
          zu deiner Einkaufsliste hinzu.
        </p>

      </div>


      <button
        class="close-button"
        type="button"
        aria-label="Schließen"
        (click)="closeModal()"
      >
        ×
      </button>

    </div>


    <div
      class="error-message"
      *ngIf="errorMessage"
    >
      {{ errorMessage }}
    </div>


    <div class="field">

      <label for="productName">
        Produktname
      </label>

      <input
        id="productName"
        type="text"
        maxlength="100"
        [(ngModel)]="productName"
        placeholder="z. B. Milch, Tomaten, Brot..."
        (keyup.enter)="saveProduct()"
      />

    </div>


    <div class="two-columns">

      <div class="field">

        <label for="quantity">
          Menge
        </label>

        <input
          id="quantity"
          type="number"
          min="0.01"
          step="0.01"
          [(ngModel)]="quantity"
          (keyup.enter)="saveProduct()"
        />

      </div>


      <div class="field">

        <label for="unit">
          Einheit
        </label>

        <select
          id="unit"
          [(ngModel)]="unit"
        >

          <option
            *ngFor="let currentUnit of units"
            [value]="currentUnit"
          >
            {{ currentUnit }}
          </option>

        </select>

      </div>

    </div>


    <div class="field">

      <label for="note">

        Notiz

        <span>
          (optional)
        </span>

      </label>

      <input
        id="note"
        type="text"
        maxlength="255"
        [(ngModel)]="note"
        placeholder="z. B. Bio, reif, fettarm..."
        (keyup.enter)="saveProduct()"
      />

    </div>


    <div class="modal-actions">

      <button
        class="secondary-button"
        type="button"
        [disabled]="isSaving"
        (click)="closeModal()"
      >
        Abbrechen
      </button>


      <button
        class="primary-button"
        type="button"
        [disabled]="
          isSaving ||
          !productName.trim() ||
          quantity === null ||
          quantity <= 0
        "
        (click)="saveProduct()"
      >

        {{
          isSaving
            ? 'Wird hinzugefügt...'
            : 'Produkt hinzufügen'
        }}

      </button>

    </div>

  </div>

</div>
