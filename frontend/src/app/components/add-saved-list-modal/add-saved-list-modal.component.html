<div
  class="modal-backdrop"
  (click)="closeModal()"
>

  <div
    class="modal"
    (click)="$event.stopPropagation()"
  >

    <div class="modal-header">

      <div class="modal-heading">

        <h2>
          Gespeicherte Liste übernehmen
        </h2>

        <p>
          Wählen Sie eine Liste aus, deren Produkte
          Sie zu Ihrer Einkaufsliste hinzufügen möchten.
        </p>

      </div>


      <button
        class="close-button"
        type="button"
        aria-label="Schließen"
        (click)="closeModal()"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M6 6l12 12"></path>
          <path d="M18 6L6 18"></path>
        </svg>
      </button>

    </div>


    <!-- LOADING -->

    <div
      class="loading-state"
      *ngIf="isLoading"
    >

      <div class="spinner"></div>

      <span>
        Gespeicherte Listen werden geladen...
      </span>

    </div>


    <!-- FEHLER -->

    <div
      class="error-state"
      *ngIf="
        !isLoading &&
        errorMessage
      "
    >
      {{ errorMessage }}
    </div>


    <!-- KEINE LISTEN -->

    <div
      class="empty-list-state"
      *ngIf="
        !isLoading &&
        !errorMessage &&
        savedLists.length === 0
      "
    >

      <div class="empty-icon">
        📋
      </div>

      <strong>
        Keine gespeicherten Listen
      </strong>

      <span>
        Erstellen Sie zuerst eine Liste unter
        „Gespeichert“.
      </span>

    </div>


    <!-- ECHTE LISTEN -->

    <div
      class="saved-list-options"
      *ngIf="
        !isLoading &&
        !errorMessage &&
        savedLists.length > 0
      "
    >

      <button
        class="saved-list-option"
        type="button"
        *ngFor="let list of savedLists"
        (click)="chooseList(list)"
      >

        <div class="list-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M7 4h10"></path>
            <path d="M7 8h10"></path>
            <path d="M7 12h7"></path>
            <path d="M5 3h14v18H5z"></path>
          </svg>

        </div>


        <div class="list-info">

          <div class="list-title-row">

            <strong>
              {{ list.title }}
            </strong>

            <span class="product-count">
              {{ list.item_count || 0 }}

              {{
                (list.item_count || 0) === 1
                  ? 'Produkt'
                  : 'Produkte'
              }}
            </span>

          </div>


          <span class="product-preview">
            {{ getProductPreview(list) }}
          </span>

        </div>


        <svg
          class="arrow"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M9 6l6 6-6 6"></path>
        </svg>

      </button>

    </div>


    <button
      class="cancel-button"
      type="button"
      (click)="closeModal()"
    >
      Abbrechen
    </button>

  </div>

</div>
