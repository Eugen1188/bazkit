<div class="quantity-control">
  <input
    [id]="inputId || null"
    type="number"
    inputmode="decimal"
    [attr.aria-label]="ariaLabel"
    [attr.min]="min"
    [attr.step]="step"
    [disabled]="disabled"
    [value]="value ?? ''"
    (input)="updateValue($event)"
    (focus)="selectValue($event)"
    (blur)="markTouched()"
    (keydown.arrowup)="adjust(1, $event)"
    (keydown.arrowdown)="adjust(-1, $event)"
    (keydown.enter)="handleEnter($event)"
  />

  <div class="quantity-stepper">
    <button
      type="button"
      tabindex="-1"
      [disabled]="disabled"
      aria-label="Menge um 1 erhöhen"
      (mousedown)="$event.preventDefault()"
      (click)="adjust(1)"
    >
      <svg viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"></path></svg>
    </button>
    <button
      type="button"
      tabindex="-1"
      [disabled]="disabled"
      aria-label="Menge um 1 verringern"
      (mousedown)="$event.preventDefault()"
      (click)="adjust(-1)"
    >
      <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"></path></svg>
    </button>
  </div>
</div>
