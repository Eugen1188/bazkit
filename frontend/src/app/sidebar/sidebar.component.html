<!-- =========================
     DESKTOP SIDEBAR
========================= -->

<aside class="sidebar">

  <a
    class="logo"
    routerLink="/main/home"
  >
    <span class="logo-icon">
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M7 10V8a5 5 0 0 1 10 0v2"></path>
        <path d="M5 10h14l-1.2 10H6.2L5 10Z"></path>
        <path d="M9 14v2"></path>
        <path d="M15 14v2"></path>
      </svg>
    </span>

    <span class="logo-text">
      bazkit
    </span>
  </a>


  <div class="user-box">

    <div class="avatar">
      {{ userInitial }}
    </div>

    <span class="user-name">
      {{ userName }}
    </span>

    <span class="chevron">
      ⌄
    </span>

  </div>


  <nav class="nav">

    <!-- HOME -->
    <a
      class="nav-item"
      routerLink="/main/home"
      routerLinkActive="active"
    >
      <span class="nav-icon">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M3.5 10.5 12 3.5l8.5 7"></path>

          <path
            d="
              M5.5 9.5
              V20
              H18.5
              V9.5
            "
          ></path>

          <path
            d="
              M9.5 20
              V14
              H14.5
              V20
            "
          ></path>
        </svg>

      </span>

      Home
    </a>


    <!-- EINKAUFSLISTE -->
    <a
      class="nav-item"
      routerLink="/main/shopping-list"
      routerLinkActive="active"
    >
      <span class="nav-icon">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="
              M7 8
              V6.8
              A5 5 0 0 1 17 6.8
              V8
            "

          <path
            d="
              M5.5 8

              Z
            "
          ></path>

          <path
            d="

              L11 16
              L15.5 11.5
            "
          ></path>
        </svg>

      </span>

      Einkaufsliste
    </a>


    <!-- REZEPTE -->
    <a
      class="nav-item"
      routerLink="/main/recipe-list"
      routerLinkActive="active"
    >
      <span class="nav-icon">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="

              C6.6 4.8
              9.1 5.2
              12 7
              V19
              C9.2 17.4
              6.5 17

      Rezepte

    <!-- LISTEN -->
    <a
      class="nav-item"
      routerLink="/main/saved-list"
      routerLinkActive="active"
    >
      <span class="nav-icon">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <rect
            x="5"
            y="3.5"
            width="14"
            height="17"
            rx="2"
          ></rect>

          <path d="M8 8.5l1.4 1.4L12 7.5"></path>
          <path d="M14 9h2"></path>

          <path d="M8 14l1.4 1.4L12 13"></path>
          <path d="M14 14.5h2"></path>
        </svg>

      </span>

      Meine Listen
    </a>


    <!-- COMMUNITY -->
    <a
      class="nav-item"
      routerLink="/main/community"
      routerLinkActive="active"
    >
      <span class="nav-icon">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="8"
            r="3"
          ></circle>

          <circle
            cx="5.5"
            cy="10"
            r="2.2"
          ></circle>

          <circle
            cx="18.5"
            cy="10"
            r="2.2"
          ></circle>

          <path
            d="
              M7.5 20
              C7.5 16.8
              9.2 14.5
              12 14.5
              C14.8 14.5
              16.5 16.8
              16.5 20
            "
          ></path>

          <path
            d="
              M2.5 19
              C2.5 16.8
              3.6 15.2
              5.5 15.2
              C6.5 15.2
              7.3 15.6
              7.9 16.3
            "
          ></path>

          <path
            d="
              M21.5 19
              C21.5 16.8
              20.4 15.2
              18.5 15.2
              C17.5 15.2
              16.7 15.6
              16.1 16.3
            "
          ></path>
        </svg>

      </span>

      Community
    </a>


    <!-- EINSTELLUNGEN -->
    <a
      class="nav-item"
      routerLink="/main/settings"
      routerLinkActive="active"
    >
      <span class="nav-icon">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M4 7h7"></path>
          <path d="M15 7h5"></path>

          <circle
            cx="13"
            cy="7"
            r="2"
          ></circle>

          <path d="M4 12h3"></path>
          <path d="M11 12h9"></path>

          <circle
            cx="9"
            cy="12"
            r="2"
          ></circle>

          <path d="M4 17h9"></path>
          <path d="M17 17h3"></path>

          <circle
            cx="15"
            cy="17"
            r="2"
          ></circle>
        </svg>

      </span>

      Einstellungen
    </a>

  </nav>


  <div class="bottom">

    <div class="premium-card">

      <strong>
        👑 Premium
      </strong>

      <p>
        Mehr Funktionen.
        <br>
        Mehr Möglichkeiten.
      </p>

      <button type="button">
        Jetzt upgraden
      </button>

    </div>


    <button
      class="logout"
      type="button"
      (click)="logout()"
    >

      <span class="logout-icon">

        <svg viewBox="0 0 24 24">
          <path d="M10 17l5-5-5-5"></path>
          <path d="M15 12H3"></path>
          <path d="M21 4v16"></path>
        </svg>

      </span>

      Abmelden

    </button>

  </div>

</aside>
