<!-- =========================
     DESKTOP SIDEBAR
========================= -->

<aside class="sidebar">

  <!-- LOGO -->
  <a
    class="logo"
    routerLink="/main/home"
  >

    <span class="logo-icon">

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M7 10V8a5 5 0 0 1 10 0v2"></path>
        <path d="M5 10h14l-1.2 10H6.2L5 10Z"></path>
        <path d="M9 14v2"></path>
        <path d="M15 14v2"></path>
      </svg>

    </span>

    <span class="logo-text">
      bazkit
    </span>

  </a>


  <!-- USER -->
  <button
    class="user-box"
    type="button"
  >

    <span class="avatar">
      {{ userInitial }}
    </span>

    <span class="user-name">
      {{ userName }}
    </span>

    <span class="chevron">
      ⌄
    </span>

  </button>


  <!-- NAVIGATION -->
  <nav class="nav">

    <!-- HOME -->
    <a
      class="nav-item"
      routerLink="/main/home"
      routerLinkActive="active"
    >

      <span class="nav-icon">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M3 10.5 12 3l9 7.5"></path>
          <path d="M5.5 9.5V21h13V9.5"></path>
          <path d="M9.5 21v-6h5v6"></path>
        </svg>

      </span>

      <span>
        Home
      </span>

    </a>


    <!-- SHOPPING LIST -->
    <a
      class="nav-item"
      routerLink="/main/shopping-list"
      routerLinkActive="active"
    >

      <span class="nav-icon">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M8 6h12"></path>
          <path d="M8 12h12"></path>
          <path d="M8 18h12"></path>

          <circle
            cx="4"
            cy="6"
            r="1.2"
          ></circle>

          <circle
            cx="4"
            cy="12"
            r="1.2"
          ></circle>

          <circle
            cx="4"
            cy="18"
            r="1.2"
          ></circle>
        </svg>

      </span>

      <span>
        Einkaufsliste
      </span>

    </a>


    <!-- RECIPES -->
    <a
      class="nav-item"
      routerLink="/main/recipe-list"
      routerLinkActive="active"
    >

      <span class="nav-icon">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path d="M7 3v8"></path>
          <path d="M10 3v8"></path>
          <path d="M7 7h3"></path>
          <path d="M8.5 11v10"></path>

          <path d="M16 3v18"></path>
          <path d="M16 3c3 2.2 3.7 6 0 8"></path>

        </svg>

      </span>

      <span>
        Rezepte
      </span>

    </a>


    <!-- SAVED -->
    <a
      class="nav-item"
      routerLink="/main/saved-list"
      routerLinkActive="active"
    >

      <span class="nav-icon">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <rect
            x="5"
            y="4"
            width="14"
            height="16"
            rx="2"
          ></rect>

          <path d="M9 9h6"></path>
          <path d="M9 13h6"></path>
          <path d="M9 17h4"></path>
        </svg>

      </span>

      <span>
        Gespeichert
      </span>

    </a>


    <!-- COMMUNITY -->
    <a
      class="nav-item"
      routerLink="/main/community"
      routerLinkActive="active"
    >

      <span class="nav-icon">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <circle
            cx="9"
            cy="8"
            r="3"
          ></circle>

          <circle
            cx="17"
            cy="9"
            r="2.4"
          ></circle>

          <path d="M3.5 19c.5-4 2.8-6 5.5-6s5 2 5.5 6"></path>

          <path d="M14.5 14.5c1-.8 2.1-1.2 3.2-1.2 2.2 0 3.8 1.7 4.1 4.7"></path>

        </svg>

      </span>

      <span>
        Community
      </span>

    </a>


    <!-- SETTINGS -->
    <a
      class="nav-item"
      routerLink="/main/settings"
      routerLinkActive="active"
    >

      <span class="nav-icon">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <circle
            cx="12"
            cy="12"
            r="3"
          ></circle>

          <path d="M12 2.5v2"></path>
          <path d="M12 19.5v2"></path>

          <path d="M4.5 12h-2"></path>
          <path d="M21.5 12h-2"></path>

          <path d="m5.3 5.3 1.4 1.4"></path>
          <path d="m17.3 17.3 1.4 1.4"></path>

          <path d="m18.7 5.3-1.4 1.4"></path>
          <path d="m6.7 17.3-1.4 1.4"></path>

        </svg>

      </span>

      <span>
        Einstellungen
      </span>

    </a>

  </nav>


  <!-- BOTTOM AREA -->
  <div class="bottom">

    <div class="premium-card">

      <strong>
        👑 Premium
      </strong>

      <p>
        Mehr Funktionen.
        <br>
        Mehr Möglichkeiten.
      </p>

      <button
        type="button"
      >
        Jetzt upgraden
      </button>

    </div>


    <button
      class="logout"
      type="button"
      (click)="logout()"
    >

      <span class="logout-icon">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M10 17l5-5-5-5"></path>
          <path d="M15 12H3"></path>
          <path d="M21 4v16"></path>
        </svg>

      </span>

      Abmelden

    </button>

  </div>

</aside>

    </span>

  </a>


  <!-- PROFILE -->
  <button
    class="mobile-nav-item mobile-profile-button"
    type="button"
    [class.active]="isMobileMoreOpen"
    (click)="toggleMobileMore($event)"
  >

    <span class="mobile-avatar">
      {{ userInitial }}
    </span>

    <span>
      Profil
    </span>

  </button>


  <!-- PROFILE POPUP -->
  <div
    class="mobile-more-menu"
    *ngIf="isMobileMoreOpen"
    (click)="$event.stopPropagation()"
  >

    <div class="mobile-user">

      <div class="mobile-user-avatar">
        {{ userInitial }}
      </div>

      <div>

        <strong>
          {{ userName }}
        </strong>

        <span>
          Mein Konto
        </span>

      </div>

    </div>


    <div class="mobile-menu-divider">
    </div>


    <a
      class="mobile-settings-action"
      routerLink="/main/settings"
      (click)="isMobileMoreOpen = false"
    >

      <svg
        viewBox="0 0 24 24"

        </small>

      </div>

        </small>

      type="button"
