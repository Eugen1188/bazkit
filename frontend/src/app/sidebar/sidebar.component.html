<!-- =========================
     DESKTOP SIDEBAR
========================= -->

<aside class="sidebar">

  <a
    class="logo"
    routerLink="/main/home"
  >

    <span class="logo-icon">

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M7 10V8a5 5 0 0 1 10 0v2"></path>

        <path d="M5 10h14l-1.2 10H6.2L5 10Z"></path>

        <path d="M9 14v2"></path>

        <path d="M15 14v2"></path>
      </svg>

    </span>


    <span class="logo-text">
      bazkit
    </span>

  </a>


  <div class="user-box">

    <div class="avatar">
      {{ userInitial }}
    </div>


    <span class="user-name">
      {{ userName }}
    </span>


    <span class="chevron">
      ⌄
    </span>

  </div>


  <nav class="nav">

    <!-- HOME -->

    <a
      class="nav-item"
      routerLink="/main/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >

      <span class="nav-icon">

        <svg viewBox="0 0 24 24">

          <path
            d="M3.5 10.5 12 3l8.5 7.5"
          ></path>

          <path
            d="M5.5 9.5V21h13V9.5"
          ></path>

          <path
            d="M9.5 21v-5.5h5V21"
          ></path>

          <path
            d="M14.8 10.3c-2.9.1-4.8 1.5-5.2 4.2 2.8.4 4.8-1.1 5.2-4.2Z"
          ></path>

        </svg>

      </span>

      Home

    </a>


    <!-- EINKAUF -->

    <a
      class="nav-item"
      routerLink="/main/shopping-list"
      routerLinkActive="active"
    >

      <span class="nav-icon">

        <svg viewBox="0 0 24 24">

          <path
            d="M7 9V7a5 5 0 0 1 10 0v2"
          ></path>

          <path
            d="M5 9h14l-1 12H6L5 9Z"
          ></path>

          <path
            d="M14.7 13.2c-2.7 0-4.4 1.3-4.8 3.8 2.6.4 4.4-.9 4.8-3.8Z"
          ></path>

        </svg>

      </span>

      Einkaufsliste

    </a>


    <!-- REZEPTE -->

    <a
      class="nav-item"
      routerLink="/main/recipe-list"
      routerLinkActive="active"
    >

      <span class="nav-icon">

        <svg viewBox="0 0 24 24">

          <path
            d="M4 4.5c3.2-.8 5.8-.2 8 1.6v14c-2.2-1.8-4.8-2.4-8-1.6V4.5Z"
          ></path>

          <path
            d="M20 4.5c-3.2-.8-5.8-.2-8 1.6v14c2.2-1.8 4.8-2.4 8-1.6V4.5Z"
          ></path>

          <path
            d="M9.2 11.5c0-1 .8-1.8 1.8-1.8.2-1.1 1.1-1.9 2.2-1.9 1.2 0 2.2 1 2.2 2.2 1 .1 1.8.9 1.8 1.9 0 1.1-.9 2-2 2h-4c-1.1 0-2-.9-2-2Z"
          ></path>

        </svg>

      </span>

      Rezepte

    </a>


    <!-- LISTEN -->

    <a
      class="nav-item"
      routerLink="/main/saved-list"
      routerLinkActive="active"
    >

      <span class="nav-icon">

        <svg viewBox="0 0 24 24">

          <path
            d="M8 4h8"
          ></path>

          <path
            d="M9 3h6v3H9V3Z"
          ></path>

          <path
            d="M6 5h12a2 2 0 0 1 2 2v14H4V7a2 2 0 0 1 2-2Z"
          ></path>

          <path
            d="m8 11 1.3 1.3L12 9.5"
          ></path>

          <path
            d="M14 11h3"
          ></path>

          <path
            d="m8 16 1.3 1.3L12 14.5"
          ></path>

          <path
            d="M14 16h3"
          ></path>

        </svg>

      </span>

      Listen

    </a>


    <!-- COMMUNITY -->

    <a
      class="nav-item"
      routerLink="/main/community"
      routerLinkActive="active"
    >

      <span class="nav-icon">

        <svg viewBox="0 0 24 24">

          <circle
            cx="9"
            cy="8"
            r="3"
          ></circle>

          <circle
            cx="17"
            cy="9"
            r="2.5"
          ></circle>

          <path
            d="M3.5 19c.4-3.6 2.5-5.5 5.5-5.5s5.1 1.9 5.5 5.5"
          ></path>

          <path
            d="M14.5 14.3c1-.7 2-.9 3-.9 2.3 0 3.8 1.5 4 4"
          ></path>

          <path
            d="M13.7 15.4c-2.1.1-3.5 1.1-3.8 3 2.1.3 3.5-.8 3.8-3Z"
          ></path>

        </svg>

      </span>

      Community

    </a>


    <!-- EINSTELLUNGEN -->

    <a
      class="nav-item"
      routerLink="/main/settings"
      routerLinkActive="active"
    >

      <span class="nav-icon">

        <svg viewBox="0 0 24 24">

          <path
            d="M4 7h10"
          ></path>

          <path
            d="M18 7h2"
          ></path>

          <circle
            cx="16"
            cy="7"
            r="2"
          ></circle>

          <path
            d="M4 12h3"
          ></path>

          <path
            d="M11 12h9"
          ></path>

          <circle
            cx="9"
            cy="12"
            r="2"
          ></circle>

          <path
            d="M4 17h9"
          ></path>

          <path
            d="M17 17h3"
          ></path>

          <circle
            cx="15"
            cy="17"
            r="2"
          ></circle>

        </svg>

      </span>

      Einstellungen

    </a>

  </nav>


  <div class="bottom">

    <div class="premium-card">

      <strong>
        👑 Premium
      </strong>

      <p>
        Mehr Funktionen.
        <br>
        Mehr Möglichkeiten.
      </p>

      <button type="button">
        Jetzt upgraden
      </button>

    </div>


    <button
      class="logout"
      type="button"
      (click)="logout()"
    >

      <span class="logout-icon">

        <svg viewBox="0 0 24 24">

          <path
            d="M10 17l5-5-5-5"
          ></path>

          <path
            d="M15 12H3"
          ></path>

          <path
            d="M21 4v16"
          ></path>

        </svg>

      </span>

      Abmelden

    </button>

  </div>

</aside>
