x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  redis:
    image: redis:7-alpine
    container_name: bazkit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    logging: *default-logging

  db:
    image: postgres:16-alpine
    container_name: bazkit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging

  backend:
    build:
      context: ./backend
    container_name: bazkit-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - db
      - redis
    ports:
      - "127.0.0.1:8000:8000"
    logging: *default-logging

  backup:
    build:
      context: .
      dockerfile: ops/backup.Dockerfile
    container_name: bazkit-backup
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIRECTORY: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      OFFSITE_BACKUP_ENABLED: ${OFFSITE_BACKUP_ENABLED:-false}
      OFFSITE_BACKUP_REQUIRED: ${OFFSITE_BACKUP_REQUIRED:-false}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BACKUP_BUCKET_NAME: ${R2_BACKUP_BUCKET_NAME:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_BACKUP_PREFIX: ${R2_BACKUP_PREFIX:-database-backups}
    volumes:
      - ./backups:/backups
      - ./ops/backup-postgres.sh:/usr/local/bin/backup-postgres:ro
    command:
      - /bin/sh
      - /usr/local/bin/backup-postgres
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
    container_name: bazkit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    logging: *default-logging

  gateway:
    image: caddy:2-alpine
    container_name: bazkit-gateway
    restart: unless-stopped
    profiles: ["https"]
    environment:
      BAZKIT_DOMAIN: ${BAZKIT_DOMAIN:-localhost}
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
