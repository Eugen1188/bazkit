services:
  db:
    image: postgres:16-alpine
    container_name: bazkit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: bazkit-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
    depends_on:
      - db
    command: >
      sh -c "python manage.py migrate --noinput &&
             exec gunicorn config.wsgi:application
             --bind 0.0.0.0:8000
             --workers $${GUNICORN_WORKERS:-3}
             --threads $${GUNICORN_THREADS:-2}
             --timeout 120
             --access-logfile -
             --error-logfile -"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: bazkit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
