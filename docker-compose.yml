services:
  db:
    image: postgres:16-alpine
    container_name: bazkit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: bazkit-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
    depends_on:
      - db
    ports:
      - "8000:8000"

  backup:
    build:
      context: .
      dockerfile: ops/backup.Dockerfile
    container_name: bazkit-backup
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIRECTORY: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      OFFSITE_BACKUP_ENABLED: ${OFFSITE_BACKUP_ENABLED:-false}
      OFFSITE_BACKUP_REQUIRED: ${OFFSITE_BACKUP_REQUIRED:-false}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BACKUP_BUCKET_NAME: ${R2_BACKUP_BUCKET_NAME:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_BACKUP_PREFIX: ${R2_BACKUP_PREFIX:-database-backups}
    volumes:
      - ./backups:/backups
      - ./ops/backup-postgres.sh:/usr/local/bin/backup-postgres:ro
    command:
      - /bin/sh
      - /usr/local/bin/backup-postgres

  frontend:
    build:
      context: ./frontend
    container_name: bazkit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
